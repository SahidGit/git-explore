<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="j9iyN01f5IiP4U4IedEHdb7fkvAzkbH6bA_zi5q2JGc" />

  <!-- Preconnect & DNS prefetch for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- Non-blocking Font Loading -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&display=swap"
    />
  </noscript>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://exploregit.vercel.app/" />
  <meta property="og:title" content="GitExplorer — The Open-Source Intelligence Layer" />
  <meta property="og:description"
    content="Raw GitHub data, structured into signal. Discover trending repositories, analyze contributors, and find momentum before it's mainstream." />
  <meta property="og:image" content="https://exploregit.vercel.app/og-image.png" />

  <!-- Twitter / X -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://exploregit.vercel.app/" />
  <meta property="twitter:title" content="GitExplorer — The Open-Source Intelligence Layer" />
  <meta property="twitter:description"
    content="Raw GitHub data, structured into signal. Discover trending repositories and find momentum before it's mainstream." />
  <meta property="twitter:image" content="https://exploregit.vercel.app/og-image.png" />
  <title>GitExplorer</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
